<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cafe</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ☕ Coffee Cafe
        </div>

        <!-- Mobile Menu Button -->
        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            ☰
        </label>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <main class="content">

        <h1>Welcome to Coffee Cafe</h1>

        <p>
            Enjoy fresh coffee in a warm and comfortable environment.
        </p>


        <div class="coffee-layout">

            <div class="coffee-box">

                <img
                    src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80"
                    alt="Hot Coffee"
                >

                <h2>Hot Coffee</h2>

                <p>
                    Freshly brewed coffee for coffee lovers.
                </p>

            </div>

 
            <div class="coffee-box">

                <img
                    src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80"
                    alt="Cappuccino"
                >

                <h2>Cappuccino</h2>

                <p>
                    Rich espresso with creamy milk foam.
                </p>

            </div>


            
            <div class="coffee-box">

                <img
                    src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80"
                    alt="Iced Coffee"
                >

                <h2>Iced Coffee</h2>

                <p>
                    Refreshing cold coffee served with ice.
                </p>

            </div>

        </div>

    </main>

</body>
</html>
